<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดสอบฟังเสียง AI ภาษาไทย</title>
<style>
:root{--ink:#19372e;--muted:#687971;--line:#d8e1d8;--paper:#f7f8f3;--green:#1f5c49;--gold:#b88845}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.7 "Avenir Next",Avenir,"Segoe UI",Tahoma,"Noto Sans Thai",sans-serif}
.stripe{height:6px;background:linear-gradient(90deg,var(--green) 0 80%,var(--gold) 80%)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px 30px;max-width:460px;width:100%;text-align:center;box-shadow:0 15px 40px rgba(17,52,39,.07)}
.eyebrow{color:var(--gold);font-weight:800;letter-spacing:.02em;font-size:12px}
h1{font:400 28px/1.3 Georgia,"Noto Sans Thai",serif;margin:8px 0 10px}
p{color:var(--muted);margin:0 0 18px}
.spin{width:34px;height:34px;border:4px solid #dfe9dc;border-top-color:var(--green);border-radius:50%;margin:6px auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.button{display:block;width:100%;border:1px solid var(--green);background:var(--green);color:#fff;border-radius:11px;padding:14px;font:inherit;font-weight:700;text-decoration:none;margin-top:10px}
.button.alt{background:#fff;color:var(--green)}
#manual{display:none}
</style>
</head>
<body>
<div class="stripe"></div>
<main>
  <div class="card">
    <div class="eyebrow">ทดสอบฟังเสียงภาษาไทย</div>
    <h1>ขอบคุณที่ร่วมทดสอบ</h1>
    <div id="auto">
      <div class="spin"></div>
      <p id="msg">กำลังจัดกลุ่มให้คุณ… อยู่ครู่เดียว</p>
    </div>
    <div id="manual">
      <p>จัดกลุ่มอัตโนมัติไม่สำเร็จ กรุณาเลือกกลุ่มด้านล่าง<br>(ถ้ามีคนแจ้งกลุ่มให้แล้ว ให้เลือกตามที่แจ้ง)</p>
      <a class="button" href="groupA.html">กลุ่ม A (10 ข้อ)</a>
      <a class="button alt" href="groupB.html">กลุ่ม B (10 ข้อ)</a>
    </div>
  </div>
</main>
<script>
"use strict";
// ===== SETUP: paste your Google Apps Script Web App URL here (ends with /exec) =====
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbwuIJVKNl0BVQQIFOmiEeYG4z8MXfH0KAPljUZ7ii1TrK1HwpLlzuiYLm2v4UtQHYuZ/exec";
// ==================================================================================
const CID_KEY = "thai-tts-survey-client-id", GROUP_KEY = "thai-tts-survey-assigned-group";
function clientId(){try{let v=localStorage.getItem(CID_KEY);if(!v){v=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem(CID_KEY,v);}return v;}catch{return "no-storage-"+Date.now().toString(36);}}
function go(g){location.replace("group"+g+".html");}
function manual(){document.getElementById("auto").style.display="none";document.getElementById("manual").style.display="block";}
(async function(){
  // Same device keeps the same group
  try{const g=localStorage.getItem(GROUP_KEY);if(g==="A"||g==="B"){go(g);return;}}catch{}
  if(!/^https:\/\/script\.google\.com\//.test(SUBMIT_URL)){manual();return;}
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);
  try{
    const res=await fetch(SUBMIT_URL+"?action=assign&cid="+encodeURIComponent(clientId()),{signal:ctl.signal});
    const r=await res.json();
    if(!r.ok||(r.group!=="A"&&r.group!=="B"))throw new Error(r.error||"bad response");
    try{localStorage.setItem(GROUP_KEY,r.group);}catch{}
    go(r.group);
  }catch(e){manual();}
  finally{clearTimeout(timer);}
})();
</script>
</body>
</html>
